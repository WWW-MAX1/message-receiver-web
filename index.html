<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#176b58"><meta name="referrer" content="no-referrer"><meta name="apple-mobile-web-app-capable" content="yes"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https:; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>工作消息 · 发送到电脑</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"></head>
<body><main><header><span class="brand">M / 工作消息</span><span class="tag">端到端加密</span></header>
<section id="gate"><h1>连接你的电脑</h1><p>在电脑接收端查看配对信息，粘贴到这里。配对后使用本机口令解锁，无需安装手机 App。</p><label>配对信息（已配对时留空）<textarea id="pair" rows="4" autocomplete="off" placeholder="粘贴电脑显示的 JSON 配对信息"></textarea></label><label>可选服务器访问令牌<input id="token" type="password" autocomplete="off" placeholder="公共免费主题无需填写"></label><label>本机解锁口令<input id="password" type="password" autocomplete="current-password" placeholder="首次设置至少 10 个字符，以后用它解锁"></label><button id="unlock">配对 / 解锁</button><p class="small">口令仅用于加密此浏览器内的配对信息和待确认消息。请勿把配对信息放入网站源码或网址。忘记口令须重新配对。</p></section>
<section id="app" hidden><div class="status-card"><span id="dot" class="dot"></span><div><h2 id="state">连接状态未知</h2><p id="heartbeat">尚未取得心跳</p></div></div><p id="mode" class="small"></p><div class="actions"><button id="refresh" class="secondary">检测电脑在线</button><button id="lock" class="secondary">锁定</button></div>
<section class="compose"><label for="message">发送一条工作消息</label><textarea id="message" rows="5" placeholder="输入需要对方阅读并确认的内容…"></textarea><div class="compose-foot"><span id="count">0 / 2000 字节</span><button id="send">发送到电脑 →</button></div><p class="small">服务器接受后仍需等待电脑送达回执。离线消息仅在可用缓存内补收，不保证必达。</p></section><h2 class="list-title">待确认与最近状态</h2><div id="messages"></div></section>
<p id="notice" role="status" aria-live="polite"></p><footer>手机关闭网页后，电脑接收不受影响。<br>在浏览器菜单中选择“添加到主屏幕”即可快捷打开。</footer></main><script type="module" src="app.js"></script></body></html>
